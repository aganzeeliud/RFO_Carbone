<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Okapi Wildlife Reserve Carbon Sequestration and Storage</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
    <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body class="bg-light">
    <nav class="navbar navbar-expand-lg navbar-dark sticky-top">
        <div class="container">
            <a class="navbar-brand" href="../index.html"><i class="fas fa-leaf me-2"></i>OKAPI CARBON SEQUESTRATION</a>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="../index.html">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="../pages/about.html">About</a></li>
                    <li class="nav-item"><a class="nav-link" href="../dashboard/">Dashboard</a></li>
                    <li class="nav-item"><a class="nav-link active" href="../maps/">Interactive Map</a></li>
                    <li class="nav-item"><a class="nav-link" href="../pages/datasets.html">Datasets</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container-fluid p-0">
        <div class="row g-0">
            <!-- Sidebar Controls -->
            <div class="col-lg-3 p-4 bg-white shadow-sm" style="height: calc(100vh - 72px); overflow-y: auto;">
                <h4 class="fw-bold mb-4">Map Controls</h4>
                
                <div class="mb-4">
                    <label class="form-label fw-bold">Select Layer</label>
                    <div class="form-check mb-2">
                        <input class="form-check-input" type="radio" name="layerSelect" id="layerBiomass" checked>
                        <label class="form-check-label" for="layerBiomass">Carbon Density (GEDI)</label>
                    </div>
                    <div class="form-check mb-2">
                        <input class="form-check-input" type="radio" name="layerSelect" id="layerLoss">
                        <label class="form-check-label" for="layerLoss">Forest Loss (GFW)</label>
                    </div>
                    <div class="form-check mb-2">
                        <input class="form-check-input" type="radio" name="layerSelect" id="layerMining">
                        <label class="form-check-label" for="layerMining">Mining Concessions</label>
                    </div>
                </div>

                <div class="mb-4">
                    <label class="form-label fw-bold">Analysis Year: <span id="yearValue">2025</span></label>
                    <input type="range" class="form-range" min="2018" max="2025" step="1" id="yearSlider" value="2025">
                </div>

                <div class="glass-card mb-4 bg-light">
                    <h6>Legend</h6>
                    <div class="d-flex align-items-center mb-2">
                        <div style="width: 20px; height: 20px; background: #2d5a27; margin-right: 10px;"></div>
                        <span class="small">High Density Forest</span>
                    </div>
                    <div class="d-flex align-items-center mb-2">
                        <div style="width: 20px; height: 20px; background: #c5a059; margin-right: 10px;"></div>
                        <span class="small">Degraded / Secondary</span>
                    </div>
                    <div class="d-flex align-items-center">
                        <div style="width: 20px; height: 20px; background: #ff4d4d; margin-right: 10px;"></div>
                        <span class="small">Recent Loss Alert</span>
                    </div>
                </div>

                <button class="btn btn-primary w-100 mb-2">Export Current View</button>
                <button class="btn btn-outline-secondary w-100">Reset Map</button>
            </div>

            <!-- Map Display -->
            <div class="col-lg-9 position-relative">
                <div id="mainMap" style="height: calc(100vh - 72px); width: 100%;"></div>
            </div>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="../assets/js/app.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const map = initMap('mainMap');
            
            // Slider interactivity
            const slider = document.getElementById('yearSlider');
            const yearVal = document.getElementById('yearValue');
            slider.addEventListener('input', (e) => {
                yearVal.innerText = e.target.value;
                // In a real app, this would filter data by year
            });

            // Radio Button interactivity
            document.querySelectorAll('input[name="layerSelect"]').forEach(radio => {
                radio.addEventListener('change', (e) => {
                    const layerId = e.target.id.replace('layer', '').toLowerCase();
                    updateMapLayer(layerId);
                });
            });
        });
    </script>
</body>
</html>
